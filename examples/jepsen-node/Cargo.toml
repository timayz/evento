[package]
name = "jepsen-node"
version = "2.0.0-alpha.20"
edition = "2021"
publish = false

[[bin]]
name = "jepsen-node"
path = "src/main.rs"

[dependencies]
# evento (with the Fjall backend) is the local event store each Accord replica
# applies to and serves reads from.
evento = { workspace = true, features = ["fjall"] }
# evento-accord wraps that backend in the Accord consensus executor.
evento-accord.workspace = true
# the fjall-backed durable consensus journal (`FjallJournal`).
evento-fjall = { workspace = true, features = ["accord"] }
axum.workspace = true
tokio.workspace = true
serde_json = "1.0"
ulid.workspace = true
anyhow.workspace = true
tracing = { workspace = true }
tracing-subscriber = "0.3"
