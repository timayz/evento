[package]
name = "jepsen-node"
version = "2.0.0-alpha.22"
edition = "2021"
publish = false

[[bin]]
name = "jepsen-node"
path = "src/main.rs"

[dependencies]
evento = { workspace = true, features = ["fjall"] }
evento-accord.workspace = true
evento-fjall = { workspace = true, features = ["accord"] }
axum.workspace = true
tokio.workspace = true
serde_json = "1.0"
ulid.workspace = true
anyhow.workspace = true
tracing = { workspace = true }
tracing-subscriber = "0.3"
