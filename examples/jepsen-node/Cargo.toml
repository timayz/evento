[package]
name = "jepsen-node"
version = "2.0.0-alpha.38"
edition = "2021"
publish = false

[[bin]]
name = "jepsen-node"
path = "src/main.rs"

[dependencies]
evento = { workspace = true, features = ["fjall", "cluster"] }
axum.workspace = true
tokio.workspace = true
serde_json = "1.0"
ulid.workspace = true
anyhow.workspace = true
tracing = { workspace = true }
tracing-subscriber.workspace = true

# The examples keep out of the workspace lints (missing_docs).
[lints]
