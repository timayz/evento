[package]
name = "quickstart"
version = "2.0.0-alpha.27"
edition.workspace = true
publish = false

# `bitcode` is referenced only by macro-generated derives (#[evento::aggregate]
# emits bitcode::Encode/Decode), which machete cannot see.
[package.metadata.cargo-machete]
ignored = ["bitcode"]

[dependencies]
evento = { workspace = true, features = ["fjall"] }
anyhow.workspace = true
bitcode.workspace = true
tokio.workspace = true
tempfile = "3.27"
