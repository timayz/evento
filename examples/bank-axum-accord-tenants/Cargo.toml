[package]
name = "bank-axum-accord-tenants"
version = "2.0.0-alpha.30"
edition.workspace = true
publish = false

[dependencies]
bank.workspace = true
evento = { workspace = true, features = ["sqlite"] }
evento-accord.workspace = true
evento-sql = { workspace = true, features = ["accord", "sqlite"] }
evento-sql-migrator = { workspace = true, features = ["sqlite", "accord"] }
axum.workspace = true
askama.workspace = true
tokio.workspace = true
serde.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
ulid.workspace = true
anyhow.workspace = true
bitcode.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `bitcode` is only named by the `#[evento::aggregate]` expansion.
[package.metadata.cargo-machete]
ignored = ["bitcode"]
