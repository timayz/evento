name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
      - beta
    paths-ignore:
      - "**/Cargo.toml"
      - "Cargo.lock"

jobs:
  test:
    uses: timayz/.github/.github/workflows/rust-test.yml@v3
    with:
      mysql: true
      postgres: true
      tests: '["make test.core", "make test.sql", "make test.fjall", "make test.turso", "make test.cluster", "make test.remote", "make test.migrator", "make test.macro", "make test.lock", "make test.doc", "make check.examples"]'
