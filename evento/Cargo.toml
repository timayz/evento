[package]
name = "evento"
version = "2.0.0-alpha.28"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Event sourcing and CQRS toolkit with SQL persistence, projections, and subscriptions"
documentation = "https://docs.rs/evento"
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["anyhow", "bitcode", "sqlx", "tokio"]

[dependencies]
evento-core = { path = "../evento-core", version = "2.0.0-alpha.28" }
evento-sql = { path = "../evento-sql", optional = true, version = "2.0.0-alpha.28" }
evento-sql-migrator = { path = "../evento-sql-migrator", optional = true, version = "2.0.0-alpha.28" }
evento-fjall = { path = "../evento-fjall", optional = true, version = "2.0.0-alpha.28" }
evento-remote = { path = "../evento-remote", optional = true, version = "2.0.0-alpha.28" }
sqlx_migrator = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
bitcode.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tokio.workspace = true

[features]
default = ["macro"]
macro = ["evento-core/macro"]
group = ["evento-core/group"]
rw = ["evento-core/rw"]
sql = ["sqlite", "mysql", "postgres"]
sqlite = ["evento-sql/sqlite", "evento-sql-migrator/sqlite", "sqlx_migrator/sqlite"]
mysql = ["evento-sql/mysql", "evento-sql-migrator/mysql", "sqlx_migrator/mysql"]
postgres = ["evento-sql/postgres", "evento-sql-migrator/postgres", "sqlx_migrator/postgres"]
fjall = ["evento-fjall", "evento-fjall/rw", "rw"]
remote = ["evento-remote"]

[lints]
workspace = true
