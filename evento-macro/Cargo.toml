[package]
name = "evento-macro"
version = "2.0.0-alpha.27"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Procedural macros for the evento event sourcing toolkit."
documentation = "https://docs.rs/evento-macro"
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "ddd", "macros", "derive"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
quote.workspace = true
convert_case.workspace = true
syn.workspace = true

[dev-dependencies]
trybuild = "1"
# `sqlite` pulls in `evento::sql`, which the `Cursor` derive expands against.
evento = { workspace = true, features = ["sqlite"] }
anyhow.workspace = true
bitcode.workspace = true
serde.workspace = true
sea-query.workspace = true

[lints]
workspace = true
