[package]
name = "evento-core"
version = "2.0.0-alpha.27"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Core types and traits for evento event sourcing library."
documentation = "https://docs.rs/evento-core"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde.workspace = true
ulid.workspace = true
tokio.workspace = true
evento-macro = { path = "../evento-macro", optional = true, version = "2.0.0-alpha.27" }
anyhow.workspace = true
bitcode.workspace = true
sha3.workspace = true
hex.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
base64.workspace = true
backon.workspace = true
futures-util = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true
# Doctests are written against the `evento` facade so examples read exactly as
# users write them (a cargo-legal dev-dependency cycle).
evento.workspace = true

[features]
default = ["macro"]
macro = ["evento-macro"]
group = ["futures-util"]
rw = []

[lints]
workspace = true
