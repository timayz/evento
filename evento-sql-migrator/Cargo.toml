[package]
name = "evento-sql-migrator"
version = "2.0.0-alpha.28"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "SQL migrations for evento event sourcing library."
documentation = "https://docs.rs/evento-sql-migrator"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["evento"]

[dependencies]
evento-sql = { path = "../evento-sql", version = "2.0.0-alpha.28" }
sqlx.workspace = true
sqlx_migrator.workspace = true
sea-query.workspace = true
async-trait.workspace = true

[features]
default = ["sqlite", "mysql", "postgres"]
sqlite = ["evento-sql/sqlite", "sea-query/backend-sqlite", "sqlx/sqlite", "sqlx_migrator/sqlite"]
mysql = ["evento-sql/mysql", "sea-query/backend-mysql", "sqlx/mysql", "sqlx/migrate", "sqlx_migrator/mysql"]
postgres = ["evento-sql/postgres", "sea-query/backend-postgres", "sqlx/postgres", "sqlx/migrate", "sqlx_migrator/postgres"]
accord = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
evento = { workspace = true, features = ["sql"] }

[lints]
workspace = true
