[workspace]
resolver = "2"

members = [
    "crates/*",
    "server",
    "examples/*",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/timayz/evento"

[workspace.dependencies]
# Internal crates 
evento = { path = "./crates/evento" }
evento-test = { path = "./crates/test" }
evento-core = { path = "./crates/core" }
evento-sql = { path = "./crates/sql" }
evento-sql-migrator = { path = "./crates/sql-migrator" }
evento-macro = { path = "./crates/macro" }
evento-fjall = { path = "./crates/fjall" }
evento-accord = { path = "./crates/accord" }
bank = { path = "./examples/bank" }

# gRPC (evento-server)
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
# Pure-Rust protobuf compiler — lets the build work without a system `protoc`.
protox = "0.7"

# Core dependencies
anyhow = "1.0"
async-trait = "0.1"
bitcode = "0.6"
thiserror = "2.0"
tracing = "0.1"
base64 = "0.22"
once_cell = "1"
sha3 = "0.12"
hex = "0.4"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
futures-util = "0.3"
backon = "1.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
ulid = { version = "1.2", features = ["serde"] }

# Database
sqlx = { version = "0.9" }
sqlx_migrator = "0.19"
sea-query = { version = "1.0.1", default-features = false, features = ["derive", "audit"] }
sea-query-sqlx = { version = "0.9.1", features = ["runtime-tokio"] }
fjall = "3.1"

# Proc macro
quote = "1.0"
convert_case = "0.11"
syn = { version = "2.0.117", features = ["full", "parsing", "extra-traits"] }

# Web
axum = "0.8"
askama = "0.16"

# Testing
rand = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
