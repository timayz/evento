[package]
name = "evento-accord"
version = "2.0.0-alpha.28"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Accord consensus protocol (CEP-15) executor for evento — a leaderless, strictly-serializable, highly-available replicated event store"
documentation = "https://docs.rs/evento-accord"
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "consensus", "events", "eventstore"]
categories.workspace = true

[dependencies]
evento-core = { path = "../evento-core", version = "2.0.0-alpha.28" }
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
ulid.workspace = true
bitcode = { workspace = true, features = ["serde"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
bytes = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
evento-fjall = { path = "../evento-fjall" }
tempfile = "3.27"
rand = { workspace = true }
rcgen = "0.14"
criterion = "0.8"

[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
