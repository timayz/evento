[package]
name = "evento-accord"
version = "2.0.0-alpha.20"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Accord consensus protocol (CEP-15) executor for evento — a leaderless, strictly-serializable, highly-available replicated event store"
documentation = "https://docs.rs/evento-accord"
readme = "README.md"

[dependencies]
evento-core = { path = "../evento-core", version = "2.0.0-alpha.20" }
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
ulid.workspace = true
bitcode = { workspace = true, features = ["serde"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
bytes = "1"
fjall.workspace = true
# Optional SQL-backed Journal (consensus log on the same DB as evento-sql events).
sqlx = { workspace = true, optional = true }
sea-query = { workspace = true, optional = true }
sea-query-sqlx = { workspace = true, optional = true }

[features]
# A SQL-backed `Journal` (durable consensus state on sqlite/mysql/postgres),
# parity with `FjallJournal`. Off by default so the consensus core stays lean.
sql = ["dep:sqlx", "dep:sea-query", "dep:sea-query-sqlx", "sqlx/runtime-tokio"]
sqlite = ["sql", "sea-query/backend-sqlite", "sea-query-sqlx/sqlx-sqlite", "sqlx/sqlite"]
mysql = ["sql", "sea-query/backend-mysql", "sea-query-sqlx/sqlx-mysql", "sqlx/mysql"]
postgres = ["sql", "sea-query/backend-postgres", "sea-query-sqlx/sqlx-postgres", "sqlx/postgres"]

[dev-dependencies]
# test-util adds the paused-clock runtime (start_paused) the deterministic
# simulation uses; the workspace "full" feature set does not include it.
tokio = { workspace = true, features = ["test-util"] }
evento-fjall = { path = "../evento-fjall" }
tempfile = "3.27"
rand = { workspace = true }
rcgen = "0.13"
criterion = "0.5"

[[bench]]
name = "throughput"
harness = false

[[test]]
name = "sql_journal"
required-features = ["sqlite"]
