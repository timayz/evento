[package]
name = "evento-sql"
version = "2.0.0-alpha.23"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "SQL database implementations for evento event sourcing library."
documentation = "https://docs.rs/evento-sql"
readme = "README.md"

[dependencies]
evento-core = { path = "../evento-core", version = "2.0.0-alpha.23" }
anyhow.workspace = true
bitcode.workspace = true
async-trait.workspace = true
ulid.workspace = true
sqlx.workspace = true
sea-query.workspace = true
sea-query-sqlx.workspace = true
tokio.workspace = true
evento-accord = { path = "../evento-accord", version = "2.0.0-alpha.23", optional = true }

[dev-dependencies]
evento = { workspace = true, features = ["sql"] }
tokio.workspace = true
evento-test.workspace = true
sqlx_migrator.workspace = true
tempfile = "3.27"

[features]
default = ["sqlite", "mysql", "postgres"]
sqlite = ["evento-core/rw", "evento-core/sqlite", "sea-query/backend-sqlite", "sea-query-sqlx/sqlx-sqlite", "sqlx/sqlite"]
mysql = ["evento-core/rw", "evento-core/mysql", "sea-query/backend-mysql", "sea-query-sqlx/sqlx-mysql", "sqlx/mysql", "sqlx/mysql-rsa"]
postgres = ["evento-core/rw", "evento-core/postgres", "sea-query/backend-postgres", "sea-query-sqlx/sqlx-postgres", "sqlx/postgres"]
accord = ["dep:evento-accord", "sqlx/runtime-tokio", "sqlx/migrate"]

[[test]]
name = "sql_journal"
required-features = ["accord", "sqlite"]

[[test]]
name = "sql_journal_postgres"
required-features = ["accord", "postgres"]

[[test]]
name = "sql_journal_mysql"
required-features = ["accord", "mysql"]
