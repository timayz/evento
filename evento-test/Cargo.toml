[package]
name = "evento-test"
version = "2.0.0-alpha.38"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared conformance test suite for evento executor backends."
readme = "README.md"
publish = false

[dependencies]
evento = { path = "../evento", version = "2.0.0-alpha.38" }
bank = { path = "../examples/bank", version = "2.0.0-alpha.38" }
ulid.workspace = true
rand.workspace = true
anyhow.workspace = true
once_cell.workspace = true
bitcode.workspace = true
tokio.workspace = true
evento-cluster = { path = "../evento-cluster", version = "2.0.0-alpha.38", optional = true }

[features]
# The `cluster_backend` scenario, for a backend that implements
# `evento_cluster::ClusterBackend` under its own `cluster` feature.
cluster = ["dep:evento-cluster"]

[lints]
workspace = true
